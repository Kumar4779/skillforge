name: CI

on:
  push:
  pull_request:

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run harness tests
        run: pytest harness/tests
